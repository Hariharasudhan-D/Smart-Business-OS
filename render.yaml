# Render Blueprint: New > Blueprint > pick this repo. Fill the secret values in the Render dashboard.
services:
  - type: web
    name: smart-business-os-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # Same region as the Supabase database (ap-southeast-1): each database query stays inside Singapore.
    # Render cannot move an existing service, so this only applies when the service is first created.
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
