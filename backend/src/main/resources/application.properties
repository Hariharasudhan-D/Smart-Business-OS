spring.application.name=smart-business-os
server.port=${PORT:8080}

# Optional backend/.env (KEY=VALUE, no quotes). Real environment variables win over it.
spring.config.import=optional:file:.env[.properties]

# Supabase Postgres. Use the SESSION pooler (port 5432): Flyway migrations need session features.
# prepareThreshold=0 keeps it working if you ever point DB_PORT at the transaction pooler (6543).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}&prepareThreshold=0
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000

spring.flyway.enabled=true
# Supabase "public" is never empty; baseline at 0 so V1 still runs and existing objects are left alone.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Comma separated list of browser origins allowed to call the API directly.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
