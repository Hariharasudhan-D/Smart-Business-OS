spring.application.name=smart-business-os
server.port=${PORT:8080}
# Behind Render (or any proxy) use the X-Forwarded-For address, so login limits apply per visitor.
server.forward-headers-strategy=framework

# Optional backend/.env (KEY=VALUE, no quotes). Real environment variables win over it.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Supabase Postgres (Connect > Session pooler, port 5432: Flyway migrations need session features).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Small pool: the website shares the same Supabase connection limit.
spring.datasource.hikari.maximum-pool-size=3
# Keep all 3 open and warm: opening a new connection to Supabase takes 0.6-1.6 s, which every screen
# used to pay after a quiet minute. Replaced every 30 min, pinged every minute so none goes stale.
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
# Wait up to 20 s for a connection, and up to 60 s for the database at startup (slow cold starts on Render)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=60000

# The OS tables live in their own "os" schema, created by Flyway; the website's "public" schema is never changed.
spring.flyway.enabled=true
spring.flyway.schemas=os
# db/postgres holds PostgreSQL-only migrations (expression indexes); the H2 tests use their own list.
spring.flyway.locations=classpath:db/migration,classpath:db/postgres
spring.jpa.properties.hibernate.default_schema=os
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Comma separated list of browser origins allowed to call the API directly.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081}

# Sign-in uses the website's users table (public.users): the same email and password, and role ADMIN is required.
# Random string, at least 32 characters, that signs the OS login tokens.
app.auth.jwt-secret=${JWT_SECRET:}
# How long a web sign-in lasts (days).
app.auth.token-days=${AUTH_TOKEN_DAYS:7}
# The phone app's sign-in lasts 90 days and is renewed while the app is used (POST /api/auth/refresh),
# so it stays signed in until Sign out, without tokens that work for years if copied.
app.auth.app-token-days=${AUTH_APP_TOKEN_DAYS:90}
